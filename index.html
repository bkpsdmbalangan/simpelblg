<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan ke Portal SIMPEL...</title>

    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        /* Mengatur reset dasar agar layar penuh */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e293b; /* Warna dasar menyatu dengan overlay */
            overflow: hidden; /* Mencegah scroll */
        }

        /* --- LOADING OVERLAY --- */
        .loading-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); /* Gradien halus Navy Blue */
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            color: white;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); /* Transisi memudar yang lebih natural */
            z-index: 9999;
        }

        /* --- PURE CSS SPINNER --- */
        .css-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.15); /* Cincin dasar yang tipis dan transparan */
            border-top-color: #ffffff; /* Warna utama putaran */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        /* --- TEKS LOADING --- */
        .loading-text {
            font-weight: 500; 
            color: #f8fafc; 
            letter-spacing: 3px; 
            font-size: 0.95rem;
            text-transform: uppercase;
            animation: pulse-text 2s infinite ease-in-out;
        }

        /* --- KEYFRAMES ANIMASI --- */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="css-spinner"></div>
        <div class="loading-text">Memuat Portal SIMPEL</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Waktu loading (dalam milidetik). 3000 = 3 Detik
            const waktuLoading = 3000; 

            setTimeout(function() {
                // 1. Berikan efek memudar (fade out)
                const loadingElement = document.getElementById('loading');
                loadingElement.style.opacity = '0';
                
                // 2. Tunggu transisi memudar selesai (600ms), lalu alihkan halaman
                setTimeout(function() {
                    window.location.href = "https://portal.simpelblg.id";
                }, 600);

            }, waktuLoading);
        });
    </script>
</body>
</html>
